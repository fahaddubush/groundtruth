name: Groundtruth CI Retrieval Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-regression-gate:
    name: Test Suite & CI Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run unit and integration tests (36 tests)
        run: uv run pytest -v

      - name: Enforce Retrieval Regression Gate (Recall@10 Drop <= 1.0%)
        run: uv run python scripts/ci_gate.py --candidate reranked
