[project]
name = "groundtruth"
version = "0.1.0"
description = "Retrieval Evaluation Harness & CI Regression Gate for Legal Research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "rank-bm25>=0.2.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
